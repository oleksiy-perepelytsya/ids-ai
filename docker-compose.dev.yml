version: '3.8'

# Development configuration with code volume mounts for live reload
# Usage: docker compose -f docker-compose.dev.yml up

services:
  ids:
    build:
      context: .
      args:
        CLAUDE_CODE: "true"
    container_name: ids-app-dev
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/gcloud/application_default_credentials.json
    volumes:
      # Mount code for live development
      - ./ids:/app/ids
      - ./tests:/app/tests
      - ${PROJECTS_ROOT:-./projects}:/projects
      - ${HOME}/.config/gcloud/application_default_credentials.json:/run/gcloud/application_default_credentials.json:ro
    depends_on:
      - mongodb
      - qdrant
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: sh -c "sleep 10 && python -m ids"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: ids-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ids
    command: mongod --bind_ip_all --wiredTigerCacheSizeGB 0.5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ids-qdrant-dev
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_dev:/qdrant/storage
    environment:
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ids-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  mongodb_data_dev:
  qdrant_data_dev:
  redis_data_dev:
